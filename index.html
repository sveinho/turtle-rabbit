<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Semantic DB</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px;">

    <h1>Butikk-dashboard</h1>
    
    <h2>Kjøpshistorikk (Relasjoner på tvers av moduler):</h2>
    <div id="purchase-history">Laster historikk...</div>

    <h2>Alle tilgjengelige produkter:</h2>
    <div id="product-list">Laster produkter...</div>

    <script type="module">
        import { Store } from 'https://unpkg.com';
        import { loadProductModule, renderProducts } from './modules/products/products.js';
        import { loadUserModule, renderPurchaseHistory } from './modules/users/users.js';

        // 1. Opprett den sentrale graf-databasen
        const globalStore = new Store();

        async function initApp() {
            // 2. Last inn data parallelt fra de flate Turtle-filene på GitHub Pages
            await Promise.all([
                loadProductModule(globalStore),
                loadUserModule(globalStore)
            ]);
            
            // 3. Render ut de to ulike visningene basert på felles data
            renderPurchaseHistory(globalStore, 'purchase-history');
            renderProducts(globalStore, 'product-list');
        }

        initApp();
    </script>
</body>
</html>
