<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKOS Katalog Søk</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .loading { color: #666; font-style: italic; }
        .concept { border-bottom: 1px solid #eee; padding: 15px 0; }
        .prefLabel { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; color: #0066cc; }
        .altLabel { font-size: 14px; color: #666; margin: 0 0 5px 0; }
        .definition { font-size: 14px; margin: 5px 0; }
        .uri { font-size: 11px; color: #999; word-break: break-all; }
    </style>
</head>
<body>

    <h1>SKOS Begrepskatalog</h1>
    
    <input type="text" id="search-input" placeholder="Søk i katalogen etter foretrukket term, alt-term eller definisjon..." disabled>
    
    <div id="status" class="loading">Laster inn og parser Turtle-data...</div>
    <div id="results"></div>

    <!-- Vi bruker N3.js for rask parsing av Turtle i nettleseren -->

    <script type="module" src="app.js"></script>
</body>
</html>
